<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Task</title>
</head>

<body>

    <h1>Edit Task</h1>

    <form method="POST">

        <label for="task">Task:</label>

        <input
            type="text"
            id="task"
            name="task"
            value="{{ task.title }}"
            required
        >

        <button type="submit">Save Changes</button>

    </form>

    <br>

    <a href="{{ url_for('tasks') }}">Back to Tasks</a>

</body>
</html>
