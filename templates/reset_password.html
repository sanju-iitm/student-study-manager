<!DOCTYPE html>
<html>
<head>
    <title>Reset Password - Student Study Manager</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Reset Password</h1>
        <p>Create a new password for your account.</p>
    </div>

    <div class="task-form">

        {% if error %}
            <p style="color: red;">{{ error }}</p>
        {% endif %}

        <form method="POST">

            <label>New Password</label><br>

            <input type="password"
                   name="password"
                   minlength="8"
                   required>

            <br><br>

            <label>Confirm New Password</label><br>

            <input type="password"
                   name="confirm_password"
                   minlength="8"
                   required>

            <br><br>

            <button type="submit" class="add-button">
                Reset Password
            </button>

        </form>

        <br>

        <a href="{{ url_for('login') }}">
            Back to Login
        </a>

    </div>

</div>

</body>
</html>
